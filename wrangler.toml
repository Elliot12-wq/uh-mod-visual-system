name = "banner-system"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false
keep_vars = true

# Secrets (never in this file or the repo): `npx wrangler secret put NAME`
#   DEVICE_HMAC_SECRET  required for permanent device bans (HMAC key for hashed device ids)
#   DEVICE_BAN_KEY      owner secret for device ban / unban requests (falls back to OWNER_KEY)
#   GUARD_MIN_VERSION   optional minimum guard version accepted by POST /guard (default 1)

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
